version: "3.9"

services:

  backend:
    build:
      context: ./Gaurakshak-backend
    container_name: gaurakshak-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./Gaurakshak-backend/.env

  customer:
    build:
      context: ./Gaurakshak-customer-frontend
    container_name: gaurakshak-customer
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ./Gaurakshak-Admin
    container_name: gaurakshak-admin
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: gaurakshak-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - customer
      - admin
      - backend
